name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 is unavailable on ubuntu-latest (Ubuntu 26.04).
    # Keep the compatibility matrix on a runner with a supported tool cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app.py server.py equity_research scripts
      - run: ruff check app.py server.py equity_research scripts tests
      - run: python -m pytest -q
      - run: python scripts/run_benchmark.py

  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start Streamlit and wait for health
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/ic-copilot.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ic-copilot.log
          exit 1

  windows-python39-compatibility:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify saved research, launch intent, and Streamlit compatibility
        run: >-
          python -m pytest -q
          tests/test_saved_research.py
          tests/test_streamlit_saved_research.py
          tests/test_investigation_storytelling.py
          tests/test_research_launch.py
          tests/test_agent_led_research.py
